spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/yorune_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.data.mongodb.uri=mongodb://localhost:27017/yorune_audit_db
spring.kafka.bootstrap-servers=localhost:9092
# JSON for all booking events (EXPIRE_BOOKING commands and SSE fan-out broadcasts).
# Without these, Kafka's byte-array defaults cannot (de)serialize the record types.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# JsonSerializer writes a __TypeId__ header; only accept our own types back.
# spring-kafka matches with PatternMatchUtils.simpleMatch: without a trailing
# '*' the package must match exactly, so the wildcard is required for subpackages.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.booking.backend.*